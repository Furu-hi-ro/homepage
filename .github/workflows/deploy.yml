name: Publish research homepage

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source files
        uses: actions/checkout@v6

      - name: Build homepage with Python
        run: python3 build.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish homepage
        id: deployment
        uses: actions/deploy-pages@v4
